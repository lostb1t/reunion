# Native builds on every push to main, published to a single rolling
# release ("latest") whose files are replaced each time.
#
# The builds contain no game data: put your own copy of Reunion's files in an
# `assets` folder next to the executable.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: reunion
          - os: windows-latest
            name: windows-x86_64
            exe: reunion.exe
          - os: macos-latest
            name: macos-arm64
            exe: reunion
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release -p reunion

      - name: Package
        shell: bash
        run: |
          dir=reunion-${{ matrix.name }}
          mkdir -p "$dir/assets"
          cp "target/release/${{ matrix.exe }}" "$dir/"
          cp -r crates/reunion/art "$dir/art"
          cat > "$dir/README.txt" <<'EOF'
          Reunion (1994), rewritten: https://github.com/lostb1t/reunion

          This build contains no game data. Copy the files of your own copy of
          Reunion (the folders GRAFIKA, SOUND, INTRO, ... and GRWAR) into the
          `assets` folder next to the executable, then run it.
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            zip -qr "$dir.zip" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: reunion-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag follows main; the release keeps its URL and gets the new files.
          git tag -f latest
          git push -f origin latest
          notes="Latest build of main ($(git rev-parse --short HEAD)). Needs your own copy of the game's files in the \`assets\` folder."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$notes"
          else
            gh release create latest --title "Latest build" --notes "$notes"
          fi
          gh release upload latest dist/*.zip --clobber
