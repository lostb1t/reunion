# Native builds on every push to main, published to a single rolling
# release ("latest") whose files are replaced each time, and the web build
# on GitHub Pages.
#
# The builds include the original game's files (game/) as `assets` next to
# the executable, which is where the game looks for them.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: reunion
          - os: windows-latest
            name: windows-x86_64
            exe: reunion.exe
          - os: macos-latest
            name: macos-arm64
            exe: reunion
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release -p reunion

      - name: Package
        shell: bash
        run: |
          dir=reunion-${{ matrix.name }}
          mkdir -p "$dir"
          cp "target/release/${{ matrix.exe }}" "$dir/"
          cp -r game "$dir/assets"
          cp -r crates/reunion/art "$dir/art"
          cat > "$dir/README.txt" <<'EOF'
          Reunion (1994), rewritten: https://github.com/lostb1t/reunion

          Run the executable. The original game's files are in `assets`, where
          your saved games go too (assets/SAVE).
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            zip -qr "$dir.zip" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: reunion-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag follows main; the release keeps its URL and gets the new files.
          git tag -f latest
          git push -f origin latest
          notes="Latest build of main ($(git rev-parse --short HEAD))."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$notes"
          else
            gh release create latest --title "Latest build" --notes "$notes"
          fi
          gh release upload latest dist/*.zip --clobber

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen, the version in Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$version" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}

      - name: Build
        run: |
          cargo build -p reunion --profile wasm-release --target wasm32-unknown-unknown
          mkdir -p site
          wasm-bindgen --target web --no-typescript --out-name reunion --out-dir site \
            target/wasm32-unknown-unknown/wasm-release/reunion.wasm
          cp web/index.html site/
          cp -r game site/assets
          cp -r crates/reunion/art site/art

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
