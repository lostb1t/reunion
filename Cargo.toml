[workspace]
resolver = "3"
members = ["crates/reunion-formats", "crates/reunion"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
